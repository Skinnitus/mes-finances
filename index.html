</style></head><body><header class="concept-header"><div class="concept-brand"><img src="./icon-192.png" alt="" class="concept-logo"><div><h1>Mes Finances</h1><div class="concept-tagline">Gérer mon budget, suivre mes comptes et garder le cap</div></div></div><span class="concept-version">MIDNIGHT BORDEAUX · V4.0</span></header><main><nav><button data-tab="daily" class="active">Mon quotidien</button><button data-tab="charges">Charges</button><button data-tab="accounts">Comptes</button><button data-tab="backup">Sauvegarde</button><button data-tab="analysis">Analyse & prévisions</button></nav><section id="daily"></section><section id="charges" class="hidden"></section><section id="accounts" class="hidden"></section><section id="backup" class="hidden"></section><section id="analysis" class="hidden"></section></main><script>
const SEED={"charges":[],"accounts":[{"name":"Courant","balance":0,"date":"2026-10-28"},{"name":"Épargne","balance":0,"date":"2026-10-28"},{"name":"FNZ Sparkonto","balance":0,"date":"2026-10-28"}],"salaries":{},"carry":{},"expenses":[],"octoberOpening":0,"octoberRemainingCharges":0};
const KEY='mes-finances-v40-ultimate-local-v1';
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch{state=structuredClone(SEED)}
// Mise à jour ciblée : Prime Music est une charge fixe, y compris dans les sauvegardes existantes.
function normalizePrime(data){if(Array.isArray(data?.charges)){for(const ch of data.charges){if(ch.id===12&&ch.name==='Prime Music Abo')ch.budget='Fixe'}}return data}
normalizePrime(state);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
let month=new Date().toISOString().slice(0,7),tab='daily',editCharge=null;
const $=id=>document.getElementById(id), eur=x=>Number(x||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function shiftMonth(m,n){let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-1+n,1)).toISOString().slice(0,7)}
function addMonths(date,n){let d=new Date(date+'T12:00:00Z'),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);let max=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,max));return d.toISOString().slice(0,10)}
function advance(date,unit,interval){if(unit.toLowerCase().startsWith('mois'))return addMonths(date,interval);let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+interval*(unit.toLowerCase().startsWith('semaine')?7:1));return d.toISOString().slice(0,10)}
function due(ch,m){
 if(!ch.active||ch.budget!=='Fixe')return 0;
 const first=m+'-01',last=v4MonthEnd(m);
 return v4Recurrences(first,last).filter(e=>String(e.id)===String(ch.id)).reduce((sum,e)=>sum+e.amountCents,0)/100;
}
function monthlyDueDetails(m){
  const entries=[],excluded=[];
  const first=m+'-01',last=v4MonthEnd(m);
  for(const e of v4Recurrences(first,last)){
    const item={id:e.id,name:e.name,date:e.date,amount:e.amountCents/100,account:e.account};
    (e.isFixed?entries:excluded).push(item);
  }
  return {entries,excluded,total:Math.round(entries.reduce((sum,e)=>sum+Math.round(e.amount*100),0))/100};
}
function renderMonthlyDueDetails(m){
  const data=monthlyDueDetails(m);
  const label=new Date(m+'-01T12:00:00Z').toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'});
  const line=e=>`<div class="row"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} · ${esc(e.account)}</div></div><b>− ${eur(e.amount)}</b></div>`;
  return `<details class="card" id="monthlyDuePanel"><summary style="cursor:pointer;font-weight:700;font-size:17px">Détail des charges de ${esc(label)} · ${eur(data.total)} (${data.entries.length} échéances)</summary><p class="muted">Les échéances ci-dessous sont toutes réservées dès le début du mois, même si leur prélèvement intervient plus tard. Les répétitions apparaissent séparément.</p>${data.entries.length?data.entries.map(line).join(''):'<p class="muted">Aucune échéance fixe ce mois.</p>'}<div class="row"><strong>Total des charges réservées</strong><strong>${eur(data.total)}</strong></div>${data.excluded.length?`<div class="notice" style="margin-top:12px"><b>À vérifier : échéances non incluses dans les charges fixes</b><p class="muted">Ces charges sont classées « Vie » dans les données importées et ne sont pas déduites automatiquement du budget.</p>${data.excluded.map(line).join('')}</div>`:''}</details>`;
}
function fixed(m){return monthlyDueDetails(m).total}
function budget(m){if(m==='2026-10')return state.octoberOpening-state.octoberRemainingCharges;let salary=state.salaries[shiftMonth(m,-1)];return salary===undefined||salary===''?null:Number(salary)-fixed(m)+Number(state.carry[m]||0)}
function expenses(m){return state.expenses.filter(e=>e.month===m).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));for(let id of ['daily','charges','accounts','backup','analysis'])$(id).classList.toggle('hidden',id!==tab);renderDaily();renderCharges();renderAccounts();renderBackup();renderV32Analysis()}
function renderDaily(){let m=month,b=budget(m),list=expenses(m),spent=list.filter(x=>(x.account||'Courant')==='Courant').reduce((a,x)=>a+Number(x.amount),0),remaining=b===null?null:b-spent,prior=shiftMonth(m,-1),sum=0;let label=new Date(m+'-01T12:00:00Z').toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'});
$('daily').innerHTML=`<div class="card"><div class="grid"><button onclick="changeMonth(-1)">‹ Mois précédent</button><button onclick="changeMonth(1)">Mois suivant ›</button></div><h2 style="text-transform:capitalize;margin-top:14px">${label}</h2>${m==='2026-10'?`<div class="notice">Octobre est exceptionnel : départ de ${eur(state.octoberOpening)} moins ${eur(state.octoberRemainingCharges)} de charges encore dues.</div>`:`<label>Salaire réellement reçu en ${new Date(prior+'-01T12:00:00Z').toLocaleDateString('fr-FR',{month:'long',timeZone:'UTC'})} (€)</label><input id="salary" type="number" step="0.01" placeholder="Saisir le salaire reçu" value="${state.salaries[prior]??''}" onchange="setSalary('${prior}',this.value)"><div class="row"><span>Charges fixes réservées</span><b>− ${eur(fixed(m))}</b></div><label>Report facultatif du mois précédent (€)</label><input type="number" step="0.01" min="0" value="${state.carry[m]||0}" onchange="setCarry('${m}',this.value)">`}<div class="row"><span>Budget de départ pour vivre</span><b>${b===null?'Salaire à renseigner':eur(b)}</b></div></div>${renderMonthlyDueDetails(m)}<div class="card hero"><span>Il me reste pour vivre</span><strong class="${remaining!==null&&remaining<0?'negative':'positive'}">${remaining===null?'—':eur(remaining)}</strong><div class="muted">${eur(spent)} de dépenses enregistrées</div></div><div class="card"><h3>Ajouter une dépense</h3><div class="grid"><div><label>Date</label><input type="date" id="expenseDate" value="${m===new Date().toISOString().slice(0,7)?new Date().toISOString().slice(0,10):m+'-01'}"></div><div><label>Montant (€)</label><input type="number" id="expenseAmount" step="0.01" min="0.01" placeholder="0,00"></div></div><label>Qu'ai-je acheté ?</label><input id="expenseName" placeholder="Courses, café, restaurant…"><div class="actions"><button class="primary" onclick="addExpense()">+ Ajouter la dépense</button></div></div><div class="card"><h3>Mes dépenses (${list.length})</h3>${list.length?list.map(e=>{sum+=(e.account||'Courant')==='Courant'?Number(e.amount):0;return `<div class="listItem"><div class="listTop"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} · ${esc(e.account||'Courant')}</div></div><div style="text-align:right"><b>− ${eur(e.amount)}</b><div class="muted">${(e.account||'Courant')==='Courant'?'Reste : '+(b===null?'—':eur(b-sum)):'Hors budget Courant'}</div></div></div><div class="actions"><button onclick="editExpense(${e.id})">Modifier</button><button class="danger" onclick="deleteExpense(${e.id})">Supprimer</button></div></div>`}).join(''):'<p class="muted">Aucune dépense pour ce mois.</p>'}</div>`}
function changeMonth(n){month=shiftMonth(month,n);render()}function setSalary(m,v){if(v==='')delete state.salaries[m];else state.salaries[m]=Number(v);save()}function setCarry(m,v){state.carry[m]=Math.max(0,Number(v)||0);save()}
function addExpense(){let name=$('expenseName').value.trim(),amount=Number($('expenseAmount').value),date=$('expenseDate').value;if(!name||!date||!(amount>0)){alert('Indique une dépense, une date et un montant positif.');return}state.expenses.push({id:Date.now(),month:date.slice(0,7),date,name,amount});month=date.slice(0,7);save()}
function deleteExpense(id){if(confirm('Supprimer cette dépense ?')){state.expenses=state.expenses.filter(x=>x.id!==id);save()}}
function editExpense(id){let e=state.expenses.find(x=>x.id===id),name=prompt('Nom de la dépense',e.name);if(name===null)return;let amount=prompt('Montant (€)',e.amount);if(amount===null)return;if(!name.trim()||!(Number(amount)>0))return alert('Valeurs invalides');e.name=name.trim();e.amount=Number(amount);save()}
function renderCharges(){let c=editCharge===null?null:state.charges.find(x=>x.id===editCharge);$('charges').innerHTML=`<div class="card"><h2>${c?'Modifier':'Ajouter'} une charge régulière</h2><label>Nom</label><input id="chName" value="${esc(c?.name||'')}"><div class="grid"><div><label>Montant (€)</label><input id="chAmount" type="number" step="0.01" min="0" value="${c?.amount??''}"></div><div><label>Première échéance</label><input id="chStart" type="date" value="${c?.start||month+'-01'}"></div><div><label>Tous les…</label><input id="chInterval" type="number" min="1" step="1" value="${c?.interval||1}"></div><div><label>Unité</label><select id="chUnit">${['Jours','Semaines','Mois'].map(u=>`<option ${c?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Compte débité</label><select id="chAccount">${state.accounts.map(a=>`<option ${c?.account===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><label>Date de fin (facultative)</label><input id="chEnd" type="date" value="${c?.end||''}"></div></div><div class="actions"><button class="primary" onclick="saveCharge()">Enregistrer</button>${c?'<button onclick="editCharge=null;render()">Annuler</button>':''}</div></div>${renderMonthlyDueDetails(month)}<div class="card"><h3>Charges régulières (${state.charges.length})</h3><p class="muted">Les charges actives sont réservées dès le début de chaque mois. Modifier une charge change les budgets recalculés.</p>${state.charges.map(ch=>`<div class="listItem"><div class="listTop"><div class="wrap"><b>${esc(ch.name)}</b><div class="muted">${esc(ch.interval)} ${esc(ch.unit.toLowerCase())} · ${esc(ch.account)} · ${ch.active?'Active':'Désactivée'}</div></div><b>${eur(ch.amount)}</b></div><div class="actions"><button onclick="editCharge=${ch.id};render();window.scrollTo(0,0)">Modifier</button><button onclick="toggleCharge(${ch.id})">${ch.active?'Désactiver':'Activer'}</button><button class="danger" onclick="deleteCharge(${ch.id})">Supprimer</button></div></div>`).join('')}</div>`}

// Version 2 : migration non destructive, données privées conservées dans localStorage.
state.transfers=Array.isArray(state.transfers)?state.transfers:[];

const TODAY=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const cents=x=>Math.round(Number(x||0)*100);

const allScheduled=(start,end)=>v4Recurrences(start,end).map(e=>({key:e.key,name:e.name,date:e.date,amount:e.amountCents/100,account:e.account,isFixed:e.isFixed,isFNZ:e.isFNZ}));
const automaticTransfers=(until=TODAY())=>{
 let first=state.accounts.reduce((s,a)=>a.date&&a.date<s?a.date:s,'9999-12-31');
 if(first==='9999-12-31'||until<first)return [];
 return allScheduled(first,until).filter(x=>x.isFNZ).map(x=>({id:'auto-'+x.key,date:x.date,from:'Courant',to:'FNZ Sparkonto',amount:x.amount,kind:'auto',label:'FNZ Sparkonto',scheduledKey:x.key}));
};
const allTransfers=(until=TODAY())=>[...automaticTransfers(until),...state.transfers.filter(t=>t.date<=until)].sort((a,b)=>a.date.localeCompare(b.date));
const accountProjected=(a,until=TODAY())=>(v4AccountBalances(until)[a.name]??cents(a.balance))/100;
// La date seule ne suffit pas : une nouvelle opération du même jour doit compter.
function v4AfterBaseline(op,a){
 const base=a.date||'9999-12-31';
 if(op.date>base)return true;
 if(op.date<base)return false;
 return Number.isFinite(Number(op.createdAt)) && Number(op.createdAt)>Number(a.baselineUpdatedAt||0);
}
function v4AccountBalances(until=TODAY()){
 const balances={};
 for(const a of state.accounts){
  if(!a||!a.name||!Number.isFinite(Number(a.balance)))continue;
  let value=cents(a.balance),base=a.date||'9999-12-31';
  for(const e of state.expenses){
   if(v4AfterBaseline(e,a)&&e.date<=until&&(e.account||'Courant')===a.name)value-=cents(e.amount);
  }
  for(const t of state.transfers){
   if(!v4AfterBaseline(t,a)||t.date>until)continue;
   if(t.from===a.name)value-=cents(t.amount);
   if(t.to===a.name)value+=cents(t.amount);
  }
  balances[a.name]=value;
 }
 return balances;
}

function renderTransfers(){let names=state.accounts.map(a=>a.name),opt=selected=>names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join(''),list=allTransfers();$('transfers').innerHTML=`<div class="card"><h2>Virements entre comptes</h2><div class="notice">Les virements FNZ planifiés sont des échéances prévisionnelles, pas des opérations bancaires confirmées. Ils ne sont jamais déduits une deuxième fois de ton reste pour vivre. Si un virement réel est retardé, corrige la charge régulière ou le solde de référence.</div><h3 style="margin-top:16px">Ajouter un virement manuel</h3><div class="grid"><div><label>Date</label><input id="trDate" type="date" value="${TODAY()}"></div><div><label>Montant (€)</label><input id="trAmount" type="number" step="0.01" min="0.01"></div><div><label>Depuis</label><select id="trFrom">${opt('Courant')}</select></div><div><label>Vers</label><select id="trTo">${opt('Épargne')}</select></div></div><label>Motif (facultatif)</label><input id="trLabel" placeholder="Épargne, remboursement…"><div class="actions"><button class="primary" onclick="saveTransfer()">Enregistrer le virement</button></div></div><div class="card"><h3>Historique des virements (${list.length})</h3>${list.length?list.slice().reverse().map(t=>`<div class="listItem"><div class="listTop"><div><b>${esc(t.label||'Virement')}</b><div class="muted">${esc(t.date)} · ${esc(t.from)} → ${esc(t.to)}</div><div class="muted">${t.kind==='auto'?'Prévu (non confirmé par la banque)':'Saisi manuellement'}</div></div><b>${eur(t.amount)}</b></div>${t.kind==='manual'?`<div class="actions"><button class="danger" onclick="removeTransfer('${esc(t.id)}')">Supprimer</button></div>`:''}</div>`).join(''):'<p class="muted">Aucun virement enregistré.</p>'}</div>`}
function renderCalendar(){let days=Number($('calDays')?.value||30),start=TODAY(),end=new Date(start+'T12:00:00Z');end.setUTCDate(end.getUTCDate()+days);let items=allScheduled(start,end.toISOString().slice(0,10));$('calendarList').innerHTML=`<p class="muted">Échéances à venir, déjà réservées dans le budget du mois correspondant. Aucune deuxième déduction.</p>${items.length?items.map(e=>`<div class="row"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} · ${esc(e.account)}${e.isFNZ?' · virement FNZ':''}</div></div><b>${eur(e.amount)}</b></div>`).join(''):'<p>Aucune échéance dans cette période.</p>'}`}
function closeMonth(){let m=month,rem=budget(m);if(rem===null){alert('Renseigne d’abord le salaire correspondant.');return}rem-=expenses(m).filter(e=>(e.account||'Courant')==='Courant').reduce((s,e)=>s+Number(e.amount),0);let max=Math.max(0,Math.round(rem*100)/100),v=prompt('Reste pour vivre : '+eur(rem)+'\nCombien reporter au mois suivant ? (0 à '+eur(max)+')',String(state.carry[shiftMonth(m,1)]||0));if(v===null)return;let amount=Number(v.replace(',','.'));if(!Number.isFinite(amount)||amount<0||amount>max){alert('Le report doit être compris entre 0 et '+eur(max));return}let next=shiftMonth(m,1);state.carry[next]=Math.round(amount*100)/100;state.closures[m]={date:TODAY(),carry:state.carry[next],remainingAtClose:Math.round(rem*100)/100};save()}

/* Reconciliation of the user's pre-pay October 2026 reference. Only migrate the
   known historical 327.03 EUR reference; never silently credit other baselines. */
function finReconcileOctoberSalary(){
 const a=state.accounts.find(x=>x.name==='Courant');
 const amount=Number(state.salaries?.['2026-10']);
 if(!a||Math.abs(Number(a.balance)-327.03)>0.001||!Number.isFinite(amount)||amount<=0)return;
 if(state.salaryReceipts['2026-10']||state.octoberSalaryReconciled)return;
 // The user confirmed that 327.03 EUR was BEFORE the October pay.
 // Baseline date is used as an effective accounting date, not a claimed bank payment date.
 const base=a.date||'2026-10-31';
 state.salaryReceipts['2026-10']={id:'salary-2026-10',date:base,account:'Courant',amount,
   createdAt:Math.max(Date.now(),Number(a.baselineUpdatedAt||0)+1),dateToVerify:true};
 state.octoberSalaryReconciled=true;
 save();
}
window.finUpdateOctoberSalaryDate=function(){
 const r=state.salaryReceipts['2026-10'];if(!r)return;
 const next=prompt('Date réelle de réception de la paie d’octobre (AAAA-MM-JJ)',r.date);
 if(next===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(next)||Number.isNaN(Date.parse(next)))return alert('Date invalide');
 r.date=next;r.dateToVerify=false;r.createdAt=Math.max(Date.now(),Number(state.accounts.find(a=>a.name===r.account)?.baselineUpdatedAt||0)+1);save();
};

 }};

function v3Theme(){const t=state.v3.theme;document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}
function v3SelectCategories(selected){return state.v3.categories.map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join('')}
function v3Category(e){return e.category&&state.v3.categories.includes(e.category)?e.category:'Autres'}
function v3Stats(m){const l=expenses(m),b=budget(m),spent=l.filter(e=>(e.account||'Courant')==='Courant').reduce((v,e)=>v+Number(e.amount||0),0);return {b,spent,rem:b===null?null:b-spent,list:l}}
function v3Projection(m){const st=v3Stats(m),today=TODAY(),end=mEnd(m),lastDay=Number(end.slice(8)),current=m===today.slice(0,7)?Math.min(lastDay,Number(today.slice(8))):m<today.slice(0,7)?lastDay:0,daysLeft=lastDay-current;
const valid=st.list.filter(e=>e.date<=today&&e.date>=m+'-01');const spentSoFar=valid.filter(e=>(e.account||'Courant')==='Courant').reduce((sum,e)=>sum+Number(e.amount||0),0);const daily=current>0?spentSoFar/current:0;
return {...st,daily,daysLeft,estimate:st.rem===null?null:st.rem-daily*daysLeft,eligible:m<=today.slice(0,7)} }
function v3PredictionHTML(m){const p=v3Projection(m);return `<div class="card"><div class="v3-inline"><h3>Prévision de fin de mois</h3><span class="v3-pill">Méthode simple</span></div>${p.estimate===null?'<p class="muted">Renseigne le salaire du mois précédent pour calculer la prévision.</p>':!p.eligible?'<p class="muted">La projection commencera quand ce mois aura débuté.</p>':`<div class="v3-metric">${eur(p.estimate)}</div><p class="muted">Moyenne observée : ${eur(p.daily)} / jour · ${p.daysLeft} jour(s) restant(s).</p><p class="v3-detail">Projection = reste actuel − moyenne des dépenses déjà enregistrées dans le mois × jours restants. Les charges fixes sont déjà réservées et ne sont pas déduites deux fois.</p>`}</div>`}

function v3Daily(){const d=$('daily');const p=v3Projection(month);const today=TODAY();const next=allScheduled(today,(()=>{let x=new Date(today+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+31);return x.toISOString().slice(0,10)})())[0];d.insertAdjacentHTML('afterbegin',`<div class="card hero"><div class="v3-kicker">Votre tableau de bord</div><div class="v3-metric">${p.rem===null?'—':eur(p.rem)}</div><div>Reste pour vivre · ${esc(month)}</div><div class="v3-tiles" style="margin-top:16px"><div class="v3-tile" style="background:#ffffff15;border-color:#ffffff35"><small style="color:#edd7e1">Dépenses variables</small><b>${eur(p.spent)}</b></div><div class="v3-tile" style="background:#ffffff15;border-color:#ffffff35"><small style="color:#edd7e1">Prochaine échéance</small><b>${next?eur(next.amount):'—'}</b><div class="v3-detail">${next?esc(next.date):'Aucune'}</div></div></div></div>`);

function v32Cents(n){const v=Number(n);return Number.isFinite(v)?Math.round((v+Number.EPSILON)*100):0}
function v32CsvCell(v){const s=String(v??'');return /[;\n\r"]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}

function v32LocalDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function v32ShiftDays(iso,n){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d+n,12));return dt.toISOString().slice(0,10)}
function v32Projection(days){
 const today=v32LocalDate(new Date()),end=v32ShiftDays(today,days);
 const accounts=Array.isArray(state.accounts)?state.accounts:[];
 const balances={};let stale=[];
 for(const a of accounts){
  if(!a||!a.name||!Number.isFinite(Number(a.balance)))continue;
  balances[a.name]=v32Cents(a.balance);
  if(a.date!==today)stale.push(a.name);
 }
 const scheduled=typeof allScheduled==='function'?allScheduled(v32ShiftDays(today,1),end):[];
 let expenseCents=0,ignored=0,fnzCents=0;
 for(const ch of scheduled){
  if(!ch||!Number.isFinite(Number(ch.amount)))continue;
  const amount=v32Cents(ch.amount);
  if(ch.isFNZ){
   if(Object.hasOwn(balances,ch.account)&&Object.hasOwn(balances,'FNZ Sparkonto')){
    balances[ch.account]-=amount;balances['FNZ Sparkonto']+=amount;fnzCents+=amount;
   }else ignored++;
  }else if(ch.isFixed){
   if(Object.hasOwn(balances,ch.account)){balances[ch.account]-=amount;expenseCents+=amount}
   else ignored++;
  }else ignored++;
 }
 const totalCents=Object.values(balances).reduce((a,b)=>a+b,0);
 return {days,end,expenseCents,fnzCents,ignored,balances,totalCents,stale,
  reliable:stale.length===0&&ignored===0&&accounts.length>0};
}
function v32DailyAllowance(){
 const today=v32LocalDate(new Date()),m=today.slice(0,7),last=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
 const days=Math.max(1,last-Number(today.slice(8))+1),b=budget(m);
 if(b===null)return null;
 const spent=expenses(m).filter(x=>(x.account||'Courant')==='Courant').reduce((a,x)=>a+v32Cents(x.amount),0);
 const available=v32Cents(b)-spent;
 return {days,available,daily:Math.floor(available/days)};
}

state.v4=state.v4&&typeof state.v4==='object'?state.v4:{};

const v4Date=(d)=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d+'T12:00:00Z'))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;
function v4MonthEnd(m){return new Date(Date.UTC(Number(m.slice(0,4)),Number(m.slice(5,7)),0)).toISOString().slice(0,10)}
const v4Money=x=>Math.round(Number(x)*100);
const v4DateShift=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function v4Recurrences(start,end){
 const out=[];
 for(const ch of state.charges){
  if(!ch.active||!v4Date(ch.start)||!Number.isSafeInteger(Number(ch.interval))||Number(ch.interval)<1||!Number.isFinite(Number(ch.amount)))continue;
  const n=Number(ch.interval),unit=String(ch.unit||'').toLowerCase(),limit=15000;
  if(unit.startsWith('mois')){
   const [sy,sm,sd]=ch.start.split('-').map(Number),a=sy*12+sm-1;
   const [ey,em]=end.split('-').map(Number),last=ey*12+em-1;
   for(let i=0;i<=last-a&&i<limit;i+=n){const m=a+i,y=Math.floor(m/12),mo=m%12+1,day=Math.min(sd,new Date(Date.UTC(y,mo,0)).getUTCDate());const date=[y,String(mo).padStart(2,'0'),String(day).padStart(2,'0')].join('-');if(date>=start&&date<=end&&(!ch.end||date<=ch.end))out.push({key:String(ch.id)+'|'+date,id:ch.id,name:ch.name,date,amountCents:v4Money(ch.amount),account:ch.account,isFNZ:ch.name==='FNZ Sparkonto'&&ch.account==='Courant',isFixed:ch.budget==='Fixe'});}
  }else if(unit.startsWith('sem')||unit.startsWith('jour')){
   const step=n*(unit.startsWith('sem')?7:1),skip=Math.max(0,Math.ceil((Date.parse(start+'T12:00:00Z')-Date.parse(ch.start+'T12:00:00Z'))/(step*86400000)));
   for(let i=skip;i<skip+limit;i++){const date=v4DateShift(ch.start,i*step);if(date>end||ch.end&&date>ch.end)break;if(date>=start)out.push({key:String(ch.id)+'|'+date,id:ch.id,name:ch.name,date,amountCents:v4Money(ch.amount),account:ch.account,isFNZ:ch.name==='FNZ Sparkonto'&&ch.account==='Courant',isFixed:ch.budget==='Fixe'});}
  }
 }
 return out.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
}
function v4Reconcile(e){

function v4Forecast(days){
 const today=TODAY(),end=v4DateShift(today,days),balances={};
 for(const a of state.accounts)if(a&&a.name&&Number.isFinite(Number(a.balance)))balances[a.name]=v4Money(a.balance);
 // Les soldes de référence peuvent dater de plusieurs jours : ne jamais masquer cet avertissement.
 const stale=state.accounts.filter(a=>a.date!==today).map(a=>a.name);

 for(const a of state.accounts){if(!Object.hasOwn(balances,a.name))continue;for(const t of state.transfers){if(t.date>a.date&&t.date<=today){if(t.from===a.name)balances[a.name]-=v4Money(t.amount);if(t.to===a.name)balances[a.name]+=v4Money(t.amount)}}}

 for(const e of v4Recurrences(v4DateShift(today,1),end)){
  if(v4Reconcile(e))continue;
  if(e.isFNZ){if(Object.hasOwn(balances,e.account)&&Object.hasOwn(balances,'FNZ Sparkonto')){balances[e.account]-=e.amountCents;balances['FNZ Sparkonto']+=e.amountCents}else ignored++}
  else if(e.isFixed&&Object.hasOwn(balances,e.account)){balances[e.account]-=e.amountCents;missing++}

function v32ValidateBackup(o){
 if(!o||typeof o!=='object'||Array.isArray(o))throw Error('Objet JSON attendu');
 for(const key of ['charges','expenses','accounts'])if(!Array.isArray(o[key])||o[key].length>100000)throw Error('Liste '+key+' incorrecte');
 if(!o.salaries||typeof o.salaries!=='object'||Array.isArray(o.salaries)||!o.carry||typeof o.carry!=='object'||Array.isArray(o.carry))throw Error('Salaires ou reports invalides');
 const amount=x=>Number.isFinite(Number(x))&&Number(x)>=0&&Number(x)<=100000000;
 if(o.accounts.some(x=>!x||typeof x.name!=='string'||!x.name.trim()||!Number.isFinite(Number(x.balance))))throw Error('Comptes invalides');
 if(new Set(o.accounts.map(x=>x.name)).size!==o.accounts.length)throw Error('Noms de comptes dupliqués');
 if(o.charges.some(x=>!x||typeof x.name!=='string'||!amount(x.amount)||!Number.isSafeInteger(Number(x.interval))||Number(x.interval)<1))throw Error('Charges invalides');
 if(o.expenses.some(x=>!x||!amount(x.amount)||!v32ValidDate(x.date)))throw Error('Dépenses invalides');
 if(o.charges.some(x=>!v32ValidDate(x.start)||x.end&&!v32ValidDate(x.end)))throw Error('Dates de charges invalides');
 if(o.transfers!==undefined&&(!Array.isArray(o.transfers)||o.transfers.some(x=>!x||!amount(x.amount)||typeof x.from!=='string'||typeof x.to!=='string'||x.from===x.to)))throw Error('Virements invalides');
 const names=new Set(o.accounts.map(a=>a.name));
 if(!names.has('Courant'))throw Error('Compte Courant absent');
 if(o.expenses.some(x=>x.account!==undefined&&!names.has(x.account)))throw Error('Dépense liée à un compte inconnu');
 if(o.charges.some(x=>!names.has(x.account)||!['Jours','Semaines','Mois'].includes(x.unit)||x.end&&x.end<x.start))throw Error('Charge liée à un compte inconnu, unité ou période incorrecte');
 if(o.transfers?.some(x=>!names.has(x.from)||!names.has(x.to)||!v32ValidDate(x.date)))throw Error('Virement avec compte ou date invalide');
 if(Object.values(o.salaries).some(x=>!amount(x))||Object.values(o.carry).some(x=>!amount(x)))throw Error('Salaire ou report invalide');
 if(o.expenses.some(x=>x.month!==x.date.slice(0,7)))throw Error('Mois de dépense incohérent');
 return true;
}
importData=async function(input){

 try{
  if(file.size>12*1024*1024)throw Error('Fichier trop volumineux');
  const parsed=JSON.parse(await file.text());v32ValidateBackup(parsed);
  if(!confirm('ATTENTION : cette restauration remplace les données de la V4.0 uniquement. Continuer ?'))return;

   next.v3.calendarView=['list','date','timeline'].includes(next.v3.calendarView)?next.v3.calendarView:'list';
   next.v3.predictionMode=next.v3.predictionMode||'simple';
   next.v4=next.v4&&typeof next.v4==='object'&&!Array.isArray(next.v4)?next.v4:{};
   next.v4.confirmed=next.v4.confirmed&&typeof next.v4.confirmed==='object'&&!Array.isArray(next.v4.confirmed)?next.v4.confirmed:{};

   state=next;
   render();
   localStorage.setItem(KEY,JSON.stringify(next));
   v3Theme();
  }catch(e){state=previous;try{render();v3Theme()}catch(_){}throw e}
 }catch(e){alert('Importation refusée : '+e.message)}finally{input.value=''}
};

setSalary=function(m,v){const old=state.salaries[m];const next=v===''?null:Number(v);if(v!==''&&(!Number.isFinite(next)||next<0))return alert('Montant de salaire invalide');if(old!==undefined&&old!==''&&Number(old)===next)return;const prior=state.salaryReceipts[m];if(v===''){delete state.salaryReceipts[m]}else{const date=prompt('Date réelle de réception du salaire (AAAA-MM-JJ). Laisser vide pour ne modifier que le budget.',dateToday());if(date===null)return;if(date&&(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date))))return alert('Date invalide');if(date){const acct=prompt('Compte crédité (Courant, Épargne ou FNZ Sparkonto)',prior?.account||'Courant');if(acct===null)return;if(!state.accounts.some(a=>a.name===acct))return alert('Compte inconnu');state.salaryReceipts[m]={date,account:acct,amount:next,createdAt:Date.now(),id:'salary-'+m}}else delete state.salaryReceipts[m];}originalSalary(m,v)};
function afterBaseline(op,a){const base=a.date||'9999-12-31';if(op.date>base)return true;if(op.date<base)return false;return Number(op.createdAt||0)>Number(a.baselineUpdatedAt||0)&&Number(op.createdAt||0)>0;}
function confirmedChargeEvents(){const keys=Object.keys(state.paidCharges).filter(k=>state.paidCharges[k]===true);if(!keys.length)return[];const dates=keys.map(k=>k.split('|').pop()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();if(!dates.length)return[];return v4Recurrences(dates[0],dates[dates.length-1]).filter(x=>state.paidCharges[x.key]===true||state.v4?.confirmed?.[x.key]===true)}
const oldBalance=v4AccountBalances;
v4AccountBalances=function(until=TODAY()){
 const b=oldBalance(until);for(const a of state.accounts){let c=b[a.name]??Math.round(Number(a.balance)*100);for(const x of state.incomes){if(x.account===a.name&&x.date<=until&&afterBaseline(x,a))c+=Math.round(Number(x.amount)*100)}for(const x of Object.values(state.salaryReceipts)){if(x.account===a.name&&x.date<=until&&afterBaseline(x,a))c+=Math.round(Number(x.amount)*100)}for(const x of confirmedChargeEvents()){if(x.date>until)continue;const meta=state.paidChargeMeta?.[x.key];const op={date:meta?.paidDate||x.date,createdAt:meta?.createdAt||0};if(op.date>until||!afterBaseline(op,a))continue;if(x.isFNZ){if(a.name==='Courant')c-=x.amountCents;if(a.name==='FNZ Sparkonto')c+=x.amountCents;}else if(x.account===a.name)c-=x.amountCents;}b[a.name]=c;}return b;
};
function saveIncome(){const date=$('finIncomeDate').value,amount=Number($('finIncomeAmount').value),account=$('finIncomeAccount').value,name=$('finIncomeName').value.trim(),budgetFlag=$('finIncomeBudget')?.checked!==false;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<=0||!name||!state.accounts.some(a=>a.name===account))return alert('Renseigne la date, le compte, le nom et un montant positif.');state.incomes.push({id:'income-'+Date.now(),date,amount:money(amount),account,name,budget:account==='Courant'&&budgetFlag,createdAt:Date.now()});save()}
window.finSaveIncome=saveIncome;
window.finDeleteIncome=id=>{if(!confirm('Supprimer cette rentrée ?'))return;state.incomes=state.incomes.filter(x=>x.id!==id);save()};
window.finConfirmCharge=(key)=>{const paid=!!state.paidCharges[key];if(paid){if(!confirm('Annuler la confirmation de paiement ?'))return;delete state.paidCharges[key];delete state.paidChargeMeta?.[key];}else{if(!confirm('Confirmer le paiement de cette échéance ? Le solde du compte sera ajusté.'))return;state.paidCharges[key]=true;state.paidChargeMeta=state.paidChargeMeta||{};state.paidChargeMeta[key]={createdAt:Date.now(),paidDate:dateToday()};}save()};
const previousDaily=renderDaily;
renderDaily=function(){previousDaily();const options=state.accounts.map(a=>'<option value="'+esc(a.name)+'">'+esc(a.name)+'</option>').join('');const list=state.incomes.filter(x=>x.date.slice(0,7)===month);const incomeTotal=list.filter(x=>x.account==='Courant'&&x.budget!==false).reduce((s,x)=>s+Number(x.amount),0);
 $('daily').insertAdjacentHTML('beforeend','<div class="card"><h2>Rentrées exceptionnelles</h2><p class="fin-dynamic-help">Les rentrées sur Courant augmentent le reste à vivre. Elles augmentent aussi le solde calculé du compte, sans double comptabilisation.</p><div class="grid"><div><label>Date de réception</label><input id="finIncomeDate" type="date" value="'+dateToday()+'"></div><div><label>Montant (€)</label><input id="finIncomeAmount" type="number" min="0.01" step="0.01"></div><div><label>Compte crédité</label><select id="finIncomeAccount">'+options+'</select></div><div><label>Libellé</label><input id="finIncomeName" placeholder="Remboursement, cadeau, prime…"></div></div><label><input id="finIncomeBudget" type="checkbox" checked> Ajouter au reste à vivre si compte Courant</label><div class="actions"><button class="primary" onclick="finSaveIncome()">+ Enregistrer la rentrée</button></div><h3>Rentrées du mois · '+eur(incomeTotal)+' dans le budget</h3>'+(list.length?list.map(x=>'<div class="fin-dynamic-row"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.date)+' · '+esc(x.account)+'</div></div><div><b class="positive">+'+eur(x.amount)+'</b><button class="danger" onclick="finDeleteIncome(\''+esc(x.id)+'\')">Supprimer</button></div></div>').join(''):'<p class="muted">Aucune rentrée exceptionnelle.</p>')+'</div>');
 const c=$('daily').querySelector('.card:has(button[onclick="closeMonth()"]),.card:has(button[onclick="reopenMonth()"])');if(c){const rem=v3Stats(month).rem;const closed=state.closures[month];c.insertAdjacentHTML('beforeend','<p class="fin-dynamic-help">À la clôture, la part non reportée reste sur le compte bancaire et sort seulement du budget. Aucun virement bancaire fictif n’est créé.</p>'+(closed?'<div class="fin-dynamic-grid"><div class="fin-dynamic-tile"><small>Report au budget suivant</small><strong>'+eur(closed.carry||0)+'</strong></div><div class="fin-dynamic-tile"><small>Conservé hors budget</small><strong>'+eur(Math.max(0,(closed.remainingAtClose||0)-(closed.carry||0)))+'</strong></div></div>':''));}
};
const prevAccounts=renderAccounts;
renderAccounts=function(){prevAccounts();const values=v4AccountBalances(TODAY()),total=Object.values(values).reduce((s,x)=>s+x,0)/100;const node=$('accounts');node.insertAdjacentHTML('afterbegin','<div class="card"><h2>Soldes calculés</h2><p class="fin-dynamic-help">Soldes de référence + mouvements enregistrés après la référence. Les opérations prévues ne sont pas débitées avant confirmation. Tu peux toujours actualiser manuellement chaque solde de référence.</p><div class="fin-dynamic-grid">'+state.accounts.map(a=>'<div class="fin-dynamic-tile"><small>'+esc(a.name)+'</small><strong>'+eur((values[a.name]??0)/100)+'</strong></div>').join('')+'</div><div class="fin-dynamic-row"><b>Patrimoine calculé</b><strong>'+eur(total)+'</strong></div></div>');
};
const prevCharges=renderCharges;
renderCharges=function(){prevCharges();const from=month+'-01',to=v4MonthEnd(month),events=v4Recurrences(from,to).filter(x=>x.isFixed);$('charges').insertAdjacentHTML('afterbegin','<div class="card"><h2>Échéances · '+esc(month)+'</h2><p class="fin-dynamic-help">Une échéance prévue est réservée dans le budget mais ne diminue le solde bancaire qu’après confirmation. Pour FNZ, la confirmation transfère l’argent du Courant vers FNZ.</p>'+(events.length?events.map(x=>'<div class="fin-dynamic-row"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.date)+' · '+esc(x.account)+' · '+eur(x.amountCents/100)+'</div></div><button '+(state.paidCharges[x.key]?'class="primary"':'')+' onclick="finConfirmCharge(\''+esc(x.key)+'\')">'+(state.paidCharges[x.key]?'Payée ✓':'Confirmer')+'</button></div>').join(''):'<p class="muted">Aucune échéance.</p>')+'</div>');
};
const prevCategories=v3RenderCategories;
v3RenderCategories=function(){prevCategories();const sums={};for(const e of expenses(month)){const name=v3Category(e);sums[name]=(sums[name]||0)+Number(e.amount||0)}const parts=Object.entries(sums).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),total=parts.reduce((s,x)=>s+x[1],0);const colors=['#bf4977','#e4a66b','#8e87d4','#4db5a7','#d783ad','#7c9bbb','#e07a88','#a6a17d'];let cumulative=0;const stops=parts.map(([name,value],i)=>{const a=cumulative/total*100;cumulative+=value;return colors[i%colors.length]+' '+a+'% '+(cumulative/total*100)+'%'});$('categories').insertAdjacentHTML('afterbegin','<div class="card"><h2>Répartition des dépenses · '+esc(month)+'</h2><p class="fin-dynamic-help">Répartition réelle des dépenses par catégorie. Les virements internes et les charges réservées ne sont pas comptés comme dépenses variables.</p>'+(total?'<div class="fin-category-donut" role="img" aria-label="Diagramme circulaire des dépenses par catégorie" style="background:conic-gradient('+stops.join(',')+')"><div>'+eur(total)+'</div></div><div class="fin-cat-legend">'+parts.map(([name,value],i)=>'<div><span><i style="background:'+colors[i%colors.length]+'"></i>'+esc(name)+'</span><b>'+eur(value)+' <small>('+(value/total*100).toFixed(1)+' %)</small></b></div>').join('')+'</div>':'<p class="muted">Aucune dépense enregistrée pour ce mois.</p>')+'</div>')};
/* Reconciliation of the user's pre-pay October 2026 reference. Only migrate the
   known historical 327.03 EUR reference; never silently credit other baselines. */
function finReconcileOctoberSalary(){
 const a=state.accounts.find(x=>x.name==='Courant');
 const amount=Number(state.salaries?.['2026-10']);
 if(!a||Math.abs(Number(a.balance)-327.03)>0.001||!Number.isFinite(amount)||amount<=0)return;
 if(state.salaryReceipts['2026-10']||state.octoberSalaryReconciled)return;
 // The user confirmed that 327.03 EUR was BEFORE the October pay.
 // Baseline date is used as an effective accounting date, not a claimed bank payment date.
 const base=a.date||'2026-10-31';
 state.salaryReceipts['2026-10']={id:'salary-2026-10',date:base,account:'Courant',amount,
   createdAt:Math.max(Date.now(),Number(a.baselineUpdatedAt||0)+1),dateToVerify:true};
 state.octoberSalaryReconciled=true;
 save();
}
window.finUpdateOctoberSalaryDate=function(){
 const r=state.salaryReceipts['2026-10'];if(!r)return;
 const next=prompt('Date réelle de réception de la paie d’octobre (AAAA-MM-JJ)',r.date);
 if(next===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(next)||Number.isNaN(Date.parse(next)))return alert('Date invalide');
 r.date=next;r.dateToVerify=false;r.createdAt=Math.max(Date.now(),Number(state.accounts.find(a=>a.name===r.account)?.baselineUpdatedAt||0)+1);save();
};
const finAccountsBeforeReconcile=renderAccounts;
renderAccounts=function(){finAccountsBeforeReconcile();const r=state.salaryReceipts['2026-10'];if(r&&r.dateToVerify){
 $('accounts').insertAdjacentHTML('afterbegin','<div class="card"><h3>Paie d’octobre intégrée</h3><p>Les '+eur(r.amount)+' de salaire sont désormais inclus dans le solde calculé du Courant, à partir de la référence de 327,03 € avant paie.</p><p class="muted">Date comptable provisoire : '+esc(r.date)+'. Vérifie la date réelle de réception pour fiabiliser l’historique.</p><button onclick="finUpdateOctoberSalaryDate()">Corriger la date de réception</button></div>');
 }};
finReconcileOctoberSalary();
const previousImport=importData;
importData=async function(input){await previousImport(input);initialize()};
})();
</script>
