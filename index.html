<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123d54"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>Mes Finances</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182b37;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#123d54;color:white;padding:22px 18px}header h1{margin:0;font-size:24px}main{max-width:650px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow:auto;margin:0 0 16px}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:650;background:#dbe8ee;color:#15394a}button.primary{background:#17688a;color:white}button.danger{background:#fce7e7;color:#8a2222}nav button.active{background:#123d54;color:white}.card{background:white;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #17384c0d}.hero{background:#dff4e9}.hero strong{font-size:34px;display:block;margin-top:6px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #edf0f3}.row:last-child{border:0}.muted{color:#60727e;font-size:13px}.negative{color:#b33434}.positive{color:#146c4a}input,select{width:100%;border:1px solid #bacbd3;border-radius:9px;padding:11px;font-size:16px;background:white;color:#182b37}label{display:block;font-size:13px;font-weight:650;margin:11px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.tiny{font-size:12px}.wrap{overflow-wrap:anywhere}h2{font-size:19px;margin:4px 0 14px}h3{font-size:16px;margin:0 0 10px}.listItem{border-bottom:1px solid #edf0f3;padding:12px 0}.listItem:last-child{border:0}.listTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.listItem button{padding:7px 9px;font-size:12px} .notice{background:#fff6dc;padding:12px;border-radius:10px;font-size:13px} @media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Mes Finances</h1><div class="muted" style="color:#c7e0ec">Mon budget, simplement</div></header><main><nav><button data-tab="daily" class="active">Mon quotidien</button><button data-tab="charges">Charges</button><button data-tab="accounts">Comptes</button><button data-tab="backup">Sauvegarde</button></nav><section id="daily"></section><section id="charges" class="hidden"></section><section id="accounts" class="hidden"></section><section id="backup" class="hidden"></section></main><script>
const SEED={"charges":[],"accounts":[{"name":"Courant","balance":0,"date":"2026-10-28"},{"name":"Épargne","balance":0,"date":"2026-10-28"},{"name":"FNZ Sparkonto","balance":0,"date":"2026-10-28"}],"salaries":{},"carry":{},"expenses":[],"octoberOpening":0,"octoberRemainingCharges":0};
const KEY='mes-finances-local-v1';
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch{state=structuredClone(SEED)}
// Mise à jour ciblée : Prime Music est une charge fixe, y compris dans les sauvegardes existantes.
function normalizePrime(data){if(Array.isArray(data?.charges)){for(const ch of data.charges){if(ch.id===12&&ch.name==='Prime Music Abo')ch.budget='Fixe'}}return data}
normalizePrime(state);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
let month=new Date().toISOString().slice(0,7),tab='daily',editCharge=null;
const $=id=>document.getElementById(id), eur=x=>Number(x||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function shiftMonth(m,n){let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-1+n,1)).toISOString().slice(0,7)}
function addMonths(date,n){let d=new Date(date+'T12:00:00Z'),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);let max=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,max));return d.toISOString().slice(0,10)}
function advance(date,unit,interval){if(unit.toLowerCase().startsWith('mois'))return addMonths(date,interval);let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+interval*(unit.toLowerCase().startsWith('semaine')?7:1));return d.toISOString().slice(0,10)}
function due(ch,m){if(!ch.active||ch.budget!=='Fixe'||!ch.start||ch.interval<1)return 0;let count=0,d=ch.start,limit=0,end=m+'-31';while(d<=end&&limit++<1200){if(d.slice(0,7)===m&&(!ch.end||d<=ch.end))count++;let next=advance(d,ch.unit,ch.interval);if(next<=d)break;d=next}return count*Number(ch.amount||0)}
function monthlyDueDetails(m){
  const entries=[], excluded=[];
  const monthEnd=new Date(Date.UTC(Number(m.slice(0,4)),Number(m.slice(5,7)),0)).toISOString().slice(0,10);
  for(const ch of state.charges){
    if(!ch.active||!ch.start||!(Number(ch.interval)>0))continue;
    let d=ch.start,iterations=0;
    while(d<=monthEnd&&iterations++<1200){
      if(d.slice(0,7)===m&&(!ch.end||d<=ch.end)){
        const item={id:ch.id,name:ch.name,date:d,amount:Number(ch.amount||0),account:ch.account};
        (ch.budget==='Fixe'?entries:excluded).push(item);
      }
      const next=advance(d,ch.unit,Number(ch.interval));
      if(next<=d)break;
      d=next;
    }
  }
  entries.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
  excluded.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
  return {entries,excluded,total:Math.round(entries.reduce((sum,e)=>sum+Math.round(e.amount*100),0))/100};
}
function renderMonthlyDueDetails(m){
  const data=monthlyDueDetails(m);
  const label=new Date(m+'-01T12:00:00Z').toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'});
  const line=e=>`<div class="row"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} · ${esc(e.account)}</div></div><b>− ${eur(e.amount)}</b></div>`;
  return `<details class="card" id="monthlyDuePanel"><summary style="cursor:pointer;font-weight:700;font-size:17px">Détail des charges de ${esc(label)} · ${eur(data.total)} (${data.entries.length} échéances)</summary><p class="muted">Les échéances ci-dessous sont toutes réservées dès le début du mois, même si leur prélèvement intervient plus tard. Les répétitions apparaissent séparément.</p>${data.entries.length?data.entries.map(line).join(''):'<p class="muted">Aucune échéance fixe ce mois.</p>'}<div class="row"><strong>Total des charges réservées</strong><strong>${eur(data.total)}</strong></div>${data.excluded.length?`<div class="notice" style="margin-top:12px"><b>À vérifier : échéances non incluses dans les charges fixes</b><p class="muted">Ces charges sont classées « Vie » dans les données importées et ne sont pas déduites automatiquement du budget.</p>${data.excluded.map(line).join('')}</div>`:''}</details>`;
}
function fixed(m){return monthlyDueDetails(m).total}
function budget(m){if(m==='2026-10')return state.octoberOpening-state.octoberRemainingCharges;let salary=state.salaries[shiftMonth(m,-1)];return salary===undefined||salary===''?null:Number(salary)-fixed(m)+Number(state.carry[m]||0)}
function expenses(m){return state.expenses.filter(e=>e.month===m).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));for(let id of ['daily','charges','accounts','backup'])$(id).classList.toggle('hidden',id!==tab);renderDaily();renderCharges();renderAccounts();renderBackup()}
function renderDaily(){let m=month,b=budget(m),list=expenses(m),spent=list.reduce((a,x)=>a+Number(x.amount),0),remaining=b===null?null:b-spent,prior=shiftMonth(m,-1),sum=0;let label=new Date(m+'-01T12:00:00Z').toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'});
$('daily').innerHTML=`<div class="card"><div class="grid"><button onclick="changeMonth(-1)">‹ Mois précédent</button><button onclick="changeMonth(1)">Mois suivant ›</button></div><h2 style="text-transform:capitalize;margin-top:14px">${label}</h2>${m==='2026-10'?`<div class="notice">Octobre est exceptionnel : départ de ${eur(state.octoberOpening)} moins ${eur(state.octoberRemainingCharges)} de charges encore dues.</div>`:`<label>Salaire réellement reçu en ${new Date(prior+'-01T12:00:00Z').toLocaleDateString('fr-FR',{month:'long',timeZone:'UTC'})} (€)</label><input id="salary" type="number" step="0.01" placeholder="Saisir le salaire reçu" value="${state.salaries[prior]??''}" onchange="setSalary('${prior}',this.value)"><div class="row"><span>Charges fixes réservées</span><b>− ${eur(fixed(m))}</b></div><label>Report facultatif du mois précédent (€)</label><input type="number" step="0.01" min="0" value="${state.carry[m]||0}" onchange="setCarry('${m}',this.value)">`}<div class="row"><span>Budget de départ pour vivre</span><b>${b===null?'Salaire à renseigner':eur(b)}</b></div></div>${renderMonthlyDueDetails(m)}<div class="card hero"><span>Il me reste pour vivre</span><strong class="${remaining!==null&&remaining<0?'negative':'positive'}">${remaining===null?'—':eur(remaining)}</strong><div class="muted">${eur(spent)} de dépenses enregistrées</div></div><div class="card"><h3>Ajouter une dépense</h3><div class="grid"><div><label>Date</label><input type="date" id="expenseDate" value="${m===new Date().toISOString().slice(0,7)?new Date().toISOString().slice(0,10):m+'-01'}"></div><div><label>Montant (€)</label><input type="number" id="expenseAmount" step="0.01" min="0.01" placeholder="0,00"></div></div><label>Qu'ai-je acheté ?</label><input id="expenseName" placeholder="Courses, café, restaurant…"><div class="actions"><button class="primary" onclick="addExpense()">+ Ajouter la dépense</button></div></div><div class="card"><h3>Mes dépenses (${list.length})</h3>${list.length?list.map(e=>{sum+=Number(e.amount);return `<div class="listItem"><div class="listTop"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.date)}</div></div><div style="text-align:right"><b>− ${eur(e.amount)}</b><div class="muted">Reste : ${b===null?'—':eur(b-sum)}</div></div></div><div class="actions"><button onclick="editExpense(${e.id})">Modifier</button><button class="danger" onclick="deleteExpense(${e.id})">Supprimer</button></div></div>`}).join(''):'<p class="muted">Aucune dépense pour ce mois.</p>'}</div>`}
function changeMonth(n){month=shiftMonth(month,n);render()}function setSalary(m,v){if(v==='')delete state.salaries[m];else state.salaries[m]=Number(v);save()}function setCarry(m,v){state.carry[m]=Math.max(0,Number(v)||0);save()}
function addExpense(){let name=$('expenseName').value.trim(),amount=Number($('expenseAmount').value),date=$('expenseDate').value;if(!name||!date||!(amount>0)){alert('Indique une dépense, une date et un montant positif.');return}state.expenses.push({id:Date.now(),month:date.slice(0,7),date,name,amount});month=date.slice(0,7);save()}
function deleteExpense(id){if(confirm('Supprimer cette dépense ?')){state.expenses=state.expenses.filter(x=>x.id!==id);save()}}
function editExpense(id){let e=state.expenses.find(x=>x.id===id),name=prompt('Nom de la dépense',e.name);if(name===null)return;let amount=prompt('Montant (€)',e.amount);if(amount===null)return;if(!name.trim()||!(Number(amount)>0))return alert('Valeurs invalides');e.name=name.trim();e.amount=Number(amount);save()}
function renderCharges(){let c=editCharge===null?null:state.charges.find(x=>x.id===editCharge);$('charges').innerHTML=`<div class="card"><h2>${c?'Modifier':'Ajouter'} une charge régulière</h2><label>Nom</label><input id="chName" value="${esc(c?.name||'')}"><div class="grid"><div><label>Montant (€)</label><input id="chAmount" type="number" step="0.01" min="0" value="${c?.amount??''}"></div><div><label>Première échéance</label><input id="chStart" type="date" value="${c?.start||month+'-01'}"></div><div><label>Tous les…</label><input id="chInterval" type="number" min="1" step="1" value="${c?.interval||1}"></div><div><label>Unité</label><select id="chUnit">${['Jours','Semaines','Mois'].map(u=>`<option ${c?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Compte débité</label><select id="chAccount">${state.accounts.map(a=>`<option ${c?.account===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><label>Date de fin (facultative)</label><input id="chEnd" type="date" value="${c?.end||''}"></div></div><div class="actions"><button class="primary" onclick="saveCharge()">Enregistrer</button>${c?'<button onclick="editCharge=null;render()">Annuler</button>':''}</div></div>${renderMonthlyDueDetails(month)}<div class="card"><h3>Charges régulières (${state.charges.length})</h3><p class="muted">Les charges actives sont réservées dès le début de chaque mois. Modifier une charge change les budgets recalculés.</p>${state.charges.map(ch=>`<div class="listItem"><div class="listTop"><div class="wrap"><b>${esc(ch.name)}</b><div class="muted">${esc(ch.interval)} ${esc(ch.unit.toLowerCase())} · ${esc(ch.account)} · ${ch.active?'Active':'Désactivée'}</div></div><b>${eur(ch.amount)}</b></div><div class="actions"><button onclick="editCharge=${ch.id};render();window.scrollTo(0,0)">Modifier</button><button onclick="toggleCharge(${ch.id})">${ch.active?'Désactiver':'Activer'}</button><button class="danger" onclick="deleteCharge(${ch.id})">Supprimer</button></div></div>`).join('')}</div>`}
function saveCharge(){let name=$('chName').value.trim(),amount=Number($('chAmount').value),start=$('chStart').value,interval=Number($('chInterval').value),unit=$('chUnit').value,account=$('chAccount').value,end=$('chEnd').value;if(!name||!start||amount<0||!Number.isInteger(interval)||interval<1||end&&end<start)return alert('Vérifie les informations de la charge.');let obj={name,amount,start,interval,unit,account,end,budget:'Fixe',active:true};if(editCharge!==null){let c=state.charges.find(x=>x.id===editCharge);Object.assign(c,obj)}else state.charges.push({id:Date.now(),...obj});editCharge=null;save()}
function toggleCharge(id){let c=state.charges.find(x=>x.id===id);c.active=!c.active;save()}function deleteCharge(id){if(confirm('Supprimer cette charge ?')){state.charges=state.charges.filter(x=>x.id!==id);save()}}
function renderAccounts(){$('accounts').innerHTML=`<div class="card"><h2>Mes trois comptes</h2><p class="muted">Soldes de référence importés de ton Excel. Les budgets ne sont pas des soldes bancaires en temps réel.</p>${state.accounts.map((a,i)=>`<div class="listItem"><b>${esc(a.name)}</b><div class="muted">Au ${esc(a.date)}</div><label>Solde de référence (€)</label><input type="number" step="0.01" value="${a.balance}" onchange="state.accounts[${i}].balance=Number(this.value);save()"><label>Date du solde</label><input type="date" value="${a.date}" onchange="state.accounts[${i}].date=this.value;save()"></div>`).join('')}</div>`}
function renderBackup(){$('backup').innerHTML=`<div class="card"><h2>Sauvegarder mes données</h2><p>Les données sont enregistrées sur cet appareil dans le navigateur. Effacer les données du navigateur peut les supprimer. Fais des sauvegardes régulières.</p><div class="actions"><button class="primary" onclick="exportData()">Exporter une sauvegarde JSON</button></div><label>Restaurer une sauvegarde JSON</label><input type="file" accept=".json,application/json" onchange="importData(this)"></div><div class="card"><h3>Informations</h3><p class="muted">Application hors ligne, sans connexion bancaire. La paie reçue un mois finance le mois suivant. Les charges FNZ restent réservées dans les charges fixes.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mes-finances-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(input){let f=input.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.charges)||!Array.isArray(obj.expenses)||!Array.isArray(obj.accounts))throw Error();if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state=normalizePrime(obj);save()}catch{alert('Sauvegarde invalide')}}

// Version 2 : migration non destructive, données privées conservées dans localStorage.
state.transfers=Array.isArray(state.transfers)?state.transfers:[];
state.closures=state.closures&&typeof state.closures==='object'?state.closures:{};
state.backupLast=state.backupLast||'';
const TODAY=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const cents=x=>Math.round(Number(x||0)*100);
const mEnd=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).toISOString().slice(0,10);
const allScheduled=(start,end)=>{
 let a=[];
 for(const ch of state.charges){if(!ch.active||!ch.start||!Number.isInteger(Number(ch.interval))||Number(ch.interval)<1)continue;
  let d=ch.start,i=0;
  while(d<=end&&i++<3000){if(d>=start&&(!ch.end||d<=ch.end))a.push({key:String(ch.id)+'|'+d,name:ch.name,date:d,amount:Number(ch.amount),account:ch.account,isFixed:ch.budget==='Fixe',isFNZ:ch.name==='FNZ Sparkonto'&&ch.account==='Courant'});let next=advance(d,ch.unit,Number(ch.interval));if(next<=d)break;d=next;}
 }
 return a.sort((x,y)=>x.date.localeCompare(y.date)||x.name.localeCompare(y.name));
};
const automaticTransfers=(until=TODAY())=>{
 let first=state.accounts.reduce((s,a)=>a.date&&a.date<s?a.date:s,'9999-12-31');
 if(first==='9999-12-31'||until<first)return [];
 return allScheduled(first,until).filter(x=>x.isFNZ).map(x=>({id:'auto-'+x.key,date:x.date,from:'Courant',to:'FNZ Sparkonto',amount:x.amount,kind:'auto',label:'FNZ Sparkonto',scheduledKey:x.key}));
};
const allTransfers=(until=TODAY())=>[...automaticTransfers(until),...state.transfers.filter(t=>t.date<=until)].sort((a,b)=>a.date.localeCompare(b.date));
const accountProjected=(a,until=TODAY())=>{
 let val=cents(a.balance),base=a.date||'9999-12-31';
 for(const t of allTransfers(until)){if(t.date<=base)continue;if(t.from===a.name)val-=cents(t.amount);if(t.to===a.name)val+=cents(t.amount)}
 return val/100;
};
function saveTransfer(){let date=$('trDate').value,from=$('trFrom').value,to=$('trTo').value,amount=Number($('trAmount').value),label=$('trLabel').value.trim();if(!date||!from||!to||from===to||!(amount>0)||!Number.isFinite(amount)){alert('Vérifie la date, les comptes et le montant.');return}state.transfers.push({id:'manual-'+Date.now(),date,from,to,amount:Math.round(amount*100)/100,kind:'manual',label:label||'Virement manuel'});save()}
function removeTransfer(id){if(!confirm('Supprimer ce virement manuel ?'))return;state.transfers=state.transfers.filter(t=>t.id!==id);save()}
function renderTransfers(){let names=state.accounts.map(a=>a.name),opt=selected=>names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join(''),list=allTransfers();$('transfers').innerHTML=`<div class="card"><h2>Virements entre comptes</h2><div class="notice">Les virements FNZ sont enregistrés automatiquement à leur date prévue, même si la banque ne les a pas encore exécutés. Ils ne sont jamais déduits une deuxième fois de ton reste pour vivre. Si un virement réel est retardé, corrige la charge régulière ou le solde de référence.</div><h3 style="margin-top:16px">Ajouter un virement manuel</h3><div class="grid"><div><label>Date</label><input id="trDate" type="date" value="${TODAY()}"></div><div><label>Montant (€)</label><input id="trAmount" type="number" step="0.01" min="0.01"></div><div><label>Depuis</label><select id="trFrom">${opt('Courant')}</select></div><div><label>Vers</label><select id="trTo">${opt('Épargne')}</select></div></div><label>Motif (facultatif)</label><input id="trLabel" placeholder="Épargne, remboursement…"><div class="actions"><button class="primary" onclick="saveTransfer()">Enregistrer le virement</button></div></div><div class="card"><h3>Historique des virements (${list.length})</h3>${list.length?list.slice().reverse().map(t=>`<div class="listItem"><div class="listTop"><div><b>${esc(t.label||'Virement')}</b><div class="muted">${esc(t.date)} · ${esc(t.from)} → ${esc(t.to)}</div><div class="muted">${t.kind==='auto'?'Programmé automatiquement (non confirmé par la banque)':'Saisi manuellement'}</div></div><b>${eur(t.amount)}</b></div>${t.kind==='manual'?`<div class="actions"><button class="danger" onclick="removeTransfer('${esc(t.id)}')">Supprimer</button></div>`:''}</div>`).join(''):'<p class="muted">Aucun virement enregistré.</p>'}</div>`}
function renderCalendar(){let days=Number($('calDays')?.value||30),start=TODAY(),end=new Date(start+'T12:00:00Z');end.setUTCDate(end.getUTCDate()+days);let items=allScheduled(start,end.toISOString().slice(0,10));$('calendarList').innerHTML=`<p class="muted">Échéances à venir, déjà réservées dans le budget du mois correspondant. Aucune deuxième déduction.</p>${items.length?items.map(e=>`<div class="row"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} · ${esc(e.account)}${e.isFNZ?' · virement FNZ':''}</div></div><b>${eur(e.amount)}</b></div>`).join(''):'<p>Aucune échéance dans cette période.</p>'}`}
function closeMonth(){let m=month,rem=budget(m);if(rem===null){alert('Renseigne d’abord le salaire correspondant.');return}rem-=expenses(m).reduce((s,e)=>s+Number(e.amount),0);let max=Math.max(0,Math.round(rem*100)/100),v=prompt('Reste pour vivre : '+eur(rem)+'\nCombien reporter au mois suivant ? (0 à '+eur(max)+')',String(state.carry[shiftMonth(m,1)]||0));if(v===null)return;let amount=Number(v.replace(',','.'));if(!Number.isFinite(amount)||amount<0||amount>max){alert('Le report doit être compris entre 0 et '+eur(max));return}let next=shiftMonth(m,1);state.carry[next]=Math.round(amount*100)/100;state.closures[m]={date:TODAY(),carry:state.carry[next],remainingAtClose:Math.round(rem*100)/100};save()}
function reopenMonth(){if(!confirm('Annuler la clôture de ce mois ? Le report du mois suivant sera remis à zéro.'))return;delete state.closures[month];state.carry[shiftMonth(month,1)]=0;save()}
const previousRender=render;
render=function(){previousRender();for(const id of ['transfers','calendar'])$(id).classList.toggle('hidden',id!==tab);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderTransfers();if(tab==='calendar')renderCalendar();};
const previousDaily=renderDaily;
renderDaily=function(){previousDaily();let b=budget(month),spent=expenses(month).reduce((s,e)=>s+Number(e.amount),0),rem=b===null?null:b-spent,closed=state.closures[month];$('daily').insertAdjacentHTML('beforeend',`<div class="card"><h3>Clôture du mois</h3><p class="muted">Le report reste facultatif. Les charges du mois suivant seront réservées séparément.</p><p>Reste actuel : <b>${rem===null?'Salaire à renseigner':eur(rem)}</b></p>${closed?`<p>Clôturé le ${esc(closed.date)} · Report choisi : ${eur(closed.carry)}</p><button onclick="reopenMonth()">Annuler la clôture</button>`:`<button class="primary" onclick="closeMonth()" ${rem===null?'disabled':''}>Clôturer et choisir le report</button>`}</div>`)};
const previousAccounts=renderAccounts;
renderAccounts=function(){previousAccounts();$('accounts').insertAdjacentHTML('beforeend',`<div class="card"><h3>Soldes après virements enregistrés</h3><p class="muted">Estimations calculées depuis les soldes de référence et les virements seulement. Elles n'incluent pas automatiquement les achats, prélèvements ou salaires : ce ne sont pas des soldes bancaires en temps réel.</p>${state.accounts.map(a=>`<div class="row"><span>${esc(a.name)}</span><b>${eur(accountProjected(a))}</b></div>`).join('')}<div class="actions"><button onclick="tab='transfers';render()">Voir les virements</button></div></div>`)};
const previousBackup=renderBackup;
renderBackup=function(){previousBackup();let days=state.backupLast?Math.floor((Date.now()-new Date(state.backupLast).getTime())/86400000):null;$('backup').insertAdjacentHTML('beforeend',`<div class="card"><h3>Suivi des sauvegardes</h3><p>${days===null?'Aucune sauvegarde exportée depuis cette version.':`Dernière sauvegarde : il y a ${days} jour(s).`}</p>${days===null||days>=7?'<div class="notice">Pense à exporter une sauvegarde JSON et à la conserver hors de ton téléphone.</div>':''}<div class="actions"><button onclick="exportCSV()">Exporter les dépenses et virements (CSV)</button></div><p class="muted">Le CSV sert à consulter tes opérations ; seul le JSON permet une restauration complète.</p></div>`)};
const previousExport=exportData;
exportData=function(){state.backupLast=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));previousExport();render()};
function exportCSV(){let rows=[['Type','Date','Nom','Depuis','Vers','Montant EUR']];for(const e of state.expenses)rows.push(['Dépense',e.date,e.name,'','',e.amount]);for(const t of allTransfers())rows.push(['Virement',t.date,t.label||'Virement',t.from,t.to,t.amount]);let content='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='mes-finances-operations-'+TODAY()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
const previousImport=importData;
importData=async function(input){let f=input.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.charges)||!Array.isArray(obj.expenses)||!Array.isArray(obj.accounts)||!obj.salaries||!obj.carry||obj.accounts.length<1||obj.charges.some(c=>typeof c.name!=='string'||!Number.isFinite(Number(c.amount)))||obj.expenses.some(e=>!Number.isFinite(Number(e.amount))))throw Error('Structure incorrecte');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;state=normalizePrime(obj);state.transfers=Array.isArray(state.transfers)?state.transfers:[];state.closures=state.closures&&typeof state.closures==='object'?state.closures:{};save()}catch(e){alert('Sauvegarde invalide : '+e.message)}};
// Navigation supplémentaire, sans modifier les onglets d'origine.
const nav=document.querySelector('nav');for(const [id,label] of [['transfers','Virements'],['calendar','Calendrier']]){let b=document.createElement('button');b.dataset.tab=id;b.textContent=label;b.onclick=()=>{tab=id;render()};nav.insertBefore(b,nav.querySelector('[data-tab="backup"]'));let section=document.createElement('section');section.id=id;section.className='hidden';document.querySelector('main').appendChild(section)}
$('calendar').innerHTML='<div class="card"><h2>Calendrier des prélèvements</h2><label>Voir les échéances des prochains jours</label><select id="calDays" onchange="renderCalendar()"><option value="7">7 jours</option><option value="14">14 jours</option><option value="30" selected>30 jours</option><option value="60">60 jours</option></select><div id="calendarList"></div></div>';
try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
if ('serviceWorker' in navigator && location.protocol==='https:') {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
